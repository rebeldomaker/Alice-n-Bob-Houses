<div id="details-modal" class="modal">
  <div class="modal-content">

<iframe

      <!-- VIEWING REQUEST FORM -->
      <section class="booking-form">
        <h3>Request a Viewing</h3>
        <form id="viewing-form" action="mailto:contact@aliceandbob.com" method="post" enctype="text/plain">
          <label for="full-name">Full Name:</label>
          <input type="text" id="full-name" name="Full Name" required>

          <label for="email">Email / Phone:</label>
          <input type="text" id="email" name="Contact Info" required>

          <label for="viewing-time">Preferred Viewing Time:</label>
          <input type="datetime-local" id="viewing-time" name="Preferred Time" required>

          <button type="submit">Send Viewing Request</button>
        </form>
      </section>
    </div>
  </div>
